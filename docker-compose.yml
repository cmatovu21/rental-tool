services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental_app
      POSTGRES_PASSWORD: rental_app_dev_password
      POSTGRES_DB: rental_management
    ports:
      - "5432:5432"
    volumes:
      - rental_app_pgdata:/var/lib/postgresql/data

volumes:
  rental_app_pgdata:
